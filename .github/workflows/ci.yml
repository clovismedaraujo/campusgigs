name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: campusgigs_test
          POSTGRES_USER: campusgigs
          POSTGRES_PASSWORD: campusgigs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusgigs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/campusgigs_test
      SPRING_DATASOURCE_USERNAME: campusgigs
      SPRING_DATASOURCE_PASSWORD: campusgigs
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        if: hashFiles('backend/pom.xml') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes do backend
        if: hashFiles('backend/pom.xml') != ''
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        if: hashFiles('frontend/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm ci
      - name: Lint do frontend
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm run lint
      - name: Testes do frontend
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm test -- --watchAll=false --passWithNoTests
      - name: Build do frontend
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm run build
  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Subir a aplicação com docker compose
        run: docker compose up -d --build
      - name: Smoke test pelo nginx (frontend → backend → PostgreSQL)
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health; then echo; break; fi
            sleep 2
          done
          curl -sf http://localhost:3000/api/health | grep -q '"UP"'
          curl -sf -o /dev/null http://localhost:3000/
          curl -sf http://localhost:3000/api/listings
      - name: Logs dos containers (em caso de falha)
        if: failure()
        run: docker compose logs
      - name: Derrubar
        if: always()
        run: docker compose down -v
