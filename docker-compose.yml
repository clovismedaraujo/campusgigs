services:
  postgres:
    image: postgres:16-alpine
    container_name: campusgigs-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-campusgigs}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
