# Sobe o CampusGigs completo: PostgreSQL + backend (Spring Boot) + frontend (React servido por nginx).
# Uso: docker compose up --build   →   http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    container_name: campusgigs-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-campusgigs}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-campusgigs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: campusgigs-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-campusgigs}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: campusgigs-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
