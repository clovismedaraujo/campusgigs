spring:
  application:
    name: campusgigs-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campusgigs}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080
  servlet:
    context-path: /api

campusgigs:
  security:
    approved-domains: ufrn.edu.br,escolar.ufrn.br,ufrn.br,imd.ufrn.br,dca.ufrn.br

